name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk ShaurmaVPN.apk

      - name: Publish release (APK only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" ShaurmaVPN.apk \
            --latest \
            --title "Шаурма VPN v${{ github.run_number }}" \
            --notes "Скачай ShaurmaVPN.apk и установи на телефон."
